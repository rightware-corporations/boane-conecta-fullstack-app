services:
  postgres:
    image: postgres:16
    container_name: boane-conecta-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boane_conecta}
      POSTGRES_USER: ${POSTGRES_USER:-boane_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boane_password_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boane_user} -d ${POSTGRES_DB:-boane_conecta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  clamav:
    image: clamav/clamav:1.3
    ports:
      - "3310:3310"

  backend:
    build:
      context: ./backend
    container_name: boane-conecta-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-boane_conecta}
      DATABASE_USERNAME: ${POSTGRES_USER:-boane_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-boane_password_dev}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-strong-secret-at-least-256-bits-long-enough-for-hs256}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage/uploads}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      OBJECT_STORAGE_QUARANTINE_BUCKET: ${OBJECT_STORAGE_QUARANTINE_BUCKET:-boane-quarantine}
      OBJECT_STORAGE_TRUSTED_BUCKET: ${OBJECT_STORAGE_TRUSTED_BUCKET:-boane-trusted}
      SCANNER_HOST: clamav
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
  minio_data:
