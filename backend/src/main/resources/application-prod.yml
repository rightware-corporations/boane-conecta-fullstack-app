server:
  port: ${PORT:${BACKEND_PORT:8080}}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:boane_conecta}}}
    username: ${JDBC_DATABASE_USERNAME:${PGUSER:${DB_USER:boane_user}}}
    password: ${JDBC_DATABASE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:boane_password_dev}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  bootstrap:
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD}
  storage:
    root: ${STORAGE_ROOT:/app/storage/uploads}
  frontend-url: ${FRONTEND_URL}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
