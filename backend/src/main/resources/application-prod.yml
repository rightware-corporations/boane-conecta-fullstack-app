server:
  port: ${PORT:${BACKEND_PORT:8080}}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:boane_conecta}}}
    username: ${JDBC_DATABASE_USERNAME:${PGUSER:${DB_USER:boane_user}}}
    password: ${JDBC_DATABASE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:boane_password_dev}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  bootstrap:
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD}
  storage:
    root: ${STORAGE_ROOT:/app/storage/uploads}
    endpoint: ${OBJECT_STORAGE_ENDPOINT}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
    quarantine-bucket: ${OBJECT_STORAGE_QUARANTINE_BUCKET:boane-quarantine}
    trusted-bucket: ${OBJECT_STORAGE_TRUSTED_BUCKET:boane-trusted}
  scanner:
    host: ${SCANNER_HOST}
    port: ${SCANNER_PORT:3310}
    timeout-millis: ${SCANNER_TIMEOUT_MILLIS:10000}
    poll-delay-millis: ${SCANNER_POLL_DELAY_MILLIS:5000}
  requests:
    draft-ttl-days: ${REQUEST_DRAFT_TTL_DAYS:90}
  frontend-url: ${FRONTEND_URL}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
