server:
  port: ${PORT:${BACKEND_PORT:8080}}

spring:
  application:
    name: boane-conecta-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/boane_conecta}
    username: ${DATABASE_USERNAME:boane_user}
    password: ${DATABASE_PASSWORD:boane_password_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-strong-secret-at-least-256-bits-long-enough-for-hs256}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  bootstrap:
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:ChangeMe123!}
  storage:
    root: ${STORAGE_ROOT:./storage/uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
