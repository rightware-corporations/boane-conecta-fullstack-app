name: Frontend quality

on:
  push:
    branches: [main, feat/fe01-access-truthfulness-stabilization]
    paths: ["frontend/**", ".github/workflows/frontend-quality.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-quality.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run test -- --run
      - run: npm run build
