name: Backend quality

on:
  push:
    branches: [master, feat/backend-f3-request-foundation]
    paths: ["backend/**", ".github/workflows/backend-quality.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-quality.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile, test and package
        run: mvn --batch-mode --no-transfer-progress verify
